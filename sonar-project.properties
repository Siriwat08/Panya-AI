sonar.projectKey=Siriwat08_Panya-AI
sonar.organization=siriwat08

# Exclude non-production code from analysis (must be single-line — SonarCloud multi-line \\ continuation can fail silently)
sonar.exclusions=scripts/**,examples/**,tests/**,node_modules/**,.next/**,src/components/ui/**,mini-services/**

# Exclude test files
sonar.test.exclusions=scripts/**,examples/**,tests/**

# Coverage exclusions
sonar.coverage.exclusions=scripts/**,examples/**,tests/**,src/components/ui/**

# Duplication exclusions
sonar.cpd.exclusions=scripts/**,examples/**,tests/**,src/components/ui/**
