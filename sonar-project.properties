sonar.projectKey=Siriwat08_Panya-AI
sonar.organization=siriwat08

# ============================================================
# Exclusions — non-production code that should NOT be analyzed
# ============================================================
# IMPORTANT: All patterns on a SINGLE LINE, comma-separated.
# SonarCloud's properties parser does NOT reliably handle backslash
# line continuations — use single line to be safe.
#
# Categories excluded:
# 1. Build artifacts & dependencies
# 2. Internal tooling scripts (Python + TypeScript + Shell)
# 3. Example/demo code (not shipped to production)
# 4. Test infrastructure (shell scripts, fixtures)
# 5. shadcn/ui library components (third-party, vendored)
# 6. Generated Prisma client
# 7. Misc config files (no logic to analyze)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.map,scripts/**,examples/**,tests/**,mini-services/**,download/**,src/components/ui/**,prisma/**,*.config.mjs,*.config.ts,*.json,*.md,*.lock,*.html,Caddyfile,.env*,.gitignore,components.json,tsconfig.json,sonar-project.properties

# ============================================================
# Test file exclusions — files that are tests themselves
# ============================================================
sonar.test.exclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,scripts/**,examples/**

# ============================================================
# Coverage exclusions — don't require coverage on these
# ============================================================
sonar.coverage.exclusions=scripts/**,examples/**,tests/**,src/components/ui/**,prisma/**,*.config.*,src/lib/db.ts

# ============================================================
# Duplication exclusions (CPD — Copy-Paste Detector)
# ============================================================
# shadcn/ui components often look similar by design (all follow
# the same Radix pattern) — exclude from duplication detection.
# Scripts and examples are not production code.
sonar.cpd.exclusions=scripts/**,examples/**,tests/**,src/components/ui/**,prisma/**

# ============================================================
# Source directory (where our production code lives)
# ============================================================
sonar.sources=src

# ============================================================
# Language-specific settings
# ============================================================
# Don't analyze CSS duplication (Tailwind utility classes look repetitive)
sonar.css.exclusions=src/app/globals.css

# ============================================================
# Ignore issues on files that were already analyzed before exclusion
# (forces re-analysis with new exclusions)
# ============================================================
sonar.scm.disabled=false
